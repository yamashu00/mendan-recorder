<!DOCTYPE html>
<html lang="ja">

<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>面談録音ツール | Kamiyama Marugoto College</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-main: 'Noto Sans JP', sans-serif;
      --color-bg: #FFFFFF;
      --color-text: #000000;
      --color-text-sub: #888888;
      --color-border: #000000;
      --color-gray-bg: #F8F8F8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-main);
      margin: 0;
      padding: 60px 20px;
      /* 上部にたっぷり余白 */
      background-color: var(--color-gray-bg);
      color: var(--color-text);
      display: block;
      /* 中央寄せではなく上から並べる */
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background-color: var(--color-bg);
      padding: 60px 45px;
      border: 2px solid var(--color-border);
      margin: 0 auto;
      /* 中央寄せ */
    }

    header {
      margin-bottom: 60px;
    }

    .college-name-en {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--color-text-sub);
      margin-bottom: 8px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.12em;
      margin: 0;
    }

    .header-line {
      width: 100%;
      height: 2px;
      background-color: var(--color-border);
      margin-top: 25px;
    }

    .input-group {
      margin-bottom: 35px;
    }

    .input-group label {
      display: block;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.05em;
    }

    .input-group select,
    .input-group input {
      width: 100%;
      padding: 14px;
      border: 1.5px solid var(--color-border);
      border-radius: 0;
      font-size: 15px;
      font-family: var(--font-main);
      background: var(--color-bg);
    }

    .input-group select {
      appearance: none;
      -webkit-appearance: none;
      padding-right: 40px;
    }

    .select-wrapper {
      position: relative;
    }

    .select-wrapper::after {
      content: '';
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-top: 6px solid var(--color-text);
      pointer-events: none;
    }

    .filename-preview {
      border: 1px solid #EEE;
      background-color: #FAFAFA;
      padding: 18px;
      font-size: 12px;
      color: var(--color-text-sub);
      margin-bottom: 35px;
      text-align: center;
      letter-spacing: 0.02em;
    }

    .button-group {
      display: flex;
      gap: 15px;
      margin: 30px 0;
    }

    button {
      flex: 1;
      background-color: var(--color-accent);
      color: var(--color-btn-text);
      border: 1px solid var(--color-border);
      border-radius: 0;
      padding: 18px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.1em;
      cursor: pointer;
      font-family: var(--font-main);
      transition: opacity 0.2s;
    }

    button:hover:not(:disabled) {
      opacity: 0.7;
    }

    button:disabled {
      background-color: #FFF !important;
      color: #DDD !important;
      border-color: #EEE !important;
      cursor: not-allowed;
    }

    #saveButton {
      width: 100%;
      margin-top: 10px;
    }

    #downloadButton {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      font-size: 13px;
      background: var(--color-bg);
    }

    #status {
      margin-top: 40px;
      font-size: 11px;
      text-align: center;
      color: var(--color-text-sub);
      letter-spacing: 0.05em;
    }

    .recording-state {
      background-color: var(--color-accent) !important;
      animation: pulse-black 1.5s infinite;
    }

    @keyframes pulse-black {
      0% {
        opacity: 1;
      }

      50% {
        opacity: 0.6;
      }

      100% {
        opacity: 1;
      }
    }

    .hidden {
      display: none;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 100;
    }

    .modal-box {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      border: 2px solid #000;
      padding: 40px;
      z-index: 101;
      width: 90%;
      max-width: 420px;
      font-family: var(--font-main);
    }

    .modal-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin: 0 0 24px;
    }

    .modal-script {
      background: #f8f8f8;
      border-left: 3px solid #000;
      padding: 16px 20px;
      margin-bottom: 30px;
      font-size: 15px;
      line-height: 2.2;
    }

    .modal-script p {
      margin: 0;
    }

    .student-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .student-row .select-wrapper {
      flex: 1;
    }

    .student-row .remove-btn {
      flex: 0 0 52px;
      padding: 0;
      font-size: 18px;
      background: var(--color-bg);
    }

    #addStudentBtn {
      width: 100%;
      padding: 12px;
      font-size: 13px;
      background: var(--color-bg);
      border-style: dashed;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
</head>

<body>

  <div class="container">
    <header>
      <div class="header-text">
        <div class="college-name-en" style="letter-spacing:0.08em; text-transform:none;">神山まるごと高専</div>
        <h1>面談録音ツール</h1>
      </div>
      <div class="header-line"></div>
    </header>

    <div id="loginView">
      <div class="input-group">
        <label>メールアドレス</label>
        <input type="email" id="emailInput" placeholder="example@kamiyama.ac.jp">
      </div>
      <button id="otpRequestBtn" style="max-width: 220px;">認証コード送信</button>

      <div id="otpSection" class="hidden" style="margin-top:40px;">
        <div class="input-group">
          <label>認証コード</label>
          <input type="text" id="otpInput" maxlength="6">
        </div>
        <button id="verifyBtn" style="max-width: 220px;">ログイン</button>
      </div>
    </div>

    <div id="mainView" class="hidden">
      <div id="restoreBanner" class="hidden" style="border:1.5px solid #000; background:#FFFDE7; padding:18px; margin-bottom:30px; font-size:12px; letter-spacing:0.02em;">
        <p style="margin:0 0 14px; font-weight:700;">未保存の録音データが見つかりました</p>
        <div class="button-group" style="margin:0;">
          <button id="restoreBtn">復元する</button>
          <button id="discardBtn">破棄する</button>
        </div>
        <button id="bannerDownloadBtn" style="width:100%; margin-top:10px; padding:12px; font-size:12px; background:#FFF;">端末にダウンロード</button>
      </div>
      <div class="input-group">
        <label>区分</label>
        <div class="select-wrapper">
          <select id="categorySelect">
            <option value="クラマネ面談">クラマネ面談</option>
            <option value="まるさぽ">まるさぽ</option>
            <option value="学生面談">学生面談</option>
            <option value="課外活動">課外活動</option>
            <option value="その他">その他</option>
          </select>
        </div>
      </div>
      <div class="input-group hidden" id="categoryDetailGroup">
        <label>詳細</label>
        <input type="text" id="categoryDetail" placeholder="区分の詳細を入力">
      </div>
      <div class="input-group">
        <label>面談形式</label>
        <div class="select-wrapper">
          <select id="modeSelect">
            <option value="1on1">1on1（学生1名）</option>
            <option value="3on1">2on1・3on1（学生2〜3名）</option>
          </select>
        </div>
      </div>
      <div class="input-group">
        <label>学生</label>
        <div id="studentList"></div>
        <button id="addStudentBtn" class="hidden">＋ 学生を追加</button>
      </div>
      <div class="input-group">
        <label>担当スタッフ</label>
        <div class="select-wrapper">
          <select id="staffSelect">
            <option value="">-- 選択してください --</option>
          </select>
        </div>
      </div>
      <div class="filename-preview" id="filenamePreview">区分・学生・スタッフを選択してください</div>

      <div class="button-group">
        <button id="recordButton">録音開始</button>
        <button id="stopButton" disabled>停止</button>
      </div>
      <button id="saveButton" disabled>保存して送信</button>
      <button id="downloadButton" class="hidden">録音を端末にダウンロード</button>
    </div>

    <div id="status"></div>
  </div>

  <div id="recordModal" class="hidden">
    <div class="modal-overlay"></div>
    <div class="modal-box">
      <p class="modal-label">お互いに名乗ってもらえると、文字起こしの精度が上がります！</p>
      <div class="modal-script">
        <p>「私が <strong id="modalStaffName"></strong> です。」</p>
        <div id="modalStudentLines"></div>
      </div>
      <div class="button-group" style="margin:0;">
        <button id="modalCancelBtn">キャンセル</button>
        <button id="modalStartBtn">録音を開始する</button>
      </div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxyUSb1XF1T3BjNN2WI_mQ-gpYRKXyUpcSplAWoFcEjUiPXE5nalpv_pj-4Gp-o9C6v/exec";

    let els = {};
    let mediaRecorder, audioChunks = [], originalBlob = null, stream = null;

    // 3on1: 学生を複数名選択できる（ファイル名では学籍番号を「-」でつなぐ）
    const GROUP_MIN_STUDENTS = 2, GROUP_MAX_STUDENTS = 3;
    let studentOptions = [];

    function isGroupMode() {
      return els.modeSelect.value === '3on1';
    }

    function createStudentRow(value, removable) {
      const row = document.createElement('div');
      row.className = 'student-row';
      const wrap = document.createElement('div');
      wrap.className = 'select-wrapper';
      const sel = document.createElement('select');
      sel.className = 'student-select';
      sel.innerHTML = '<option value="">-- 選択してください --</option>';
      studentOptions.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.dataset.name = s.name;
        opt.textContent = `${s.id} ${s.name}`;
        sel.appendChild(opt);
      });
      sel.value = value || '';
      sel.onchange = updatePreview;
      wrap.appendChild(sel);
      row.appendChild(wrap);
      if (removable) {
        const btn = document.createElement('button');
        btn.className = 'remove-btn';
        btn.textContent = '×';
        btn.title = 'この学生を外す';
        btn.onclick = () => {
          renderStudentRows(getStudentRowValues().filter((_, i) => i !== [...els.studentList.children].indexOf(row)));
        };
        row.appendChild(btn);
      }
      return row;
    }

    function getStudentRowValues() {
      return [...els.studentList.querySelectorAll('.student-select')].map(s => s.value);
    }

    // ids: 各行の選択値。モードに応じて行数を調整して描き直す
    function renderStudentRows(ids) {
      let values = ids ? ids.slice() : getStudentRowValues();
      if (isGroupMode()) {
        while (values.length < GROUP_MIN_STUDENTS) values.push('');
        values = values.slice(0, GROUP_MAX_STUDENTS);
      } else {
        values = values.slice(0, 1);
        if (values.length === 0) values.push('');
      }
      els.studentList.innerHTML = '';
      values.forEach(v => {
        els.studentList.appendChild(createStudentRow(v, isGroupMode() && values.length > GROUP_MIN_STUDENTS));
      });
      els.addStudentBtn.classList.toggle('hidden', !isGroupMode() || values.length >= GROUP_MAX_STUDENTS);
      updatePreview();
    }

    function addStudentRow() {
      renderStudentRows([...getStudentRowValues(), '']);
    }

    function onModeChange() {
      renderStudentRows();
    }

    // 選択済みの学生（空欄は除く）
    function getSelectedStudents() {
      return [...els.studentList.querySelectorAll('.student-select')]
        .filter(s => s.value)
        .map(s => ({ id: s.value, name: s.options[s.selectedIndex].dataset.name || '' }));
    }

    // 未選択・重複・人数不足があればメッセージを返す
    function validateStudents() {
      const rows = getStudentRowValues();
      const selected = rows.filter(v => v);
      if (selected.length < rows.length) return "学生をすべて選択してください（不要な欄は × で外してください）";
      if (new Set(selected).size !== selected.length) return "同じ学生が重複して選択されています";
      if (isGroupMode() && selected.length < GROUP_MIN_STUDENTS) return `複数名面談では学生を${GROUP_MIN_STUDENTS}名以上選択してください`;
      return "";
    }

    // IndexedDB: ウィンドウを閉じても録音データを保持する
    const IDB_NAME = 'recordingDB', IDB_STORE = 'pending';
    function openDB() {
      return new Promise((res, rej) => {
        const r = indexedDB.open(IDB_NAME, 1);
        r.onupgradeneeded = e => e.target.result.createObjectStore(IDB_STORE);
        r.onsuccess = e => res(e.target.result);
        r.onerror = () => rej(r.error);
      });
    }
    async function idbPut(key, val) {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(val, key);
        tx.oncomplete = res; tx.onerror = () => rej(tx.error);
      });
    }
    async function idbGet(key) {
      const db = await openDB();
      return new Promise((res, rej) => {
        const r = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(key);
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    }
    async function idbClear() {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).clear();
        tx.oncomplete = res; tx.onerror = () => rej(tx.error);
      });
    }
    async function checkPendingRecording() {
      try {
        const blob = await idbGet('blob');
        if (blob && els.restoreBanner) els.restoreBanner.classList.remove('hidden');
      } catch (e) {}
    }
    async function restoreRecording() {
      try {
        const blob = await idbGet('blob');
        if (blob) {
          originalBlob = blob;
          updateStatus("RESTORED — 学生・スタッフを確認して保存してください");
          await applyRestoredMeta();
        }
      } catch (e) { updateStatus("復元に失敗しました"); }
      els.restoreBanner.classList.add('hidden');
    }
    async function discardRecording() {
      await idbClear().catch(() => {});
      els.restoreBanner.classList.add('hidden');
    }
    async function applyRestoredMeta() {
      try {
        const meta = await idbGet('meta');
        if (!meta) return;
        if (els.categorySelect && meta.category) {
          els.categorySelect.value = meta.category;
          onCategoryChange();
        }
        if (els.categoryDetail && meta.detail) els.categoryDetail.value = meta.detail;
        if (meta.mode) els.modeSelect.value = meta.mode;
        const ids = meta.studentIds || (meta.studentId ? [meta.studentId] : []);
        if (studentOptions.length) renderStudentRows(ids);
        if (els.staffSelect && meta.staffName)   els.staffSelect.value   = meta.staffName;
        updatePreview();
        if (originalBlob && !validateStudents() && els.staffSelect && els.staffSelect.value) {
          els.saveButton.disabled = false;
        }
      } catch (e) {}
    }

    document.addEventListener('DOMContentLoaded', () => {
      const ids = ['loginView', 'mainView', 'emailInput', 'otpRequestBtn', 'otpSection', 'otpInput', 'verifyBtn', 'categorySelect', 'categoryDetailGroup', 'categoryDetail', 'modeSelect', 'studentList', 'addStudentBtn', 'staffSelect', 'filenamePreview', 'recordButton', 'stopButton', 'saveButton', 'status', 'audioPlayback', 'recordModal', 'modalStaffName', 'modalStudentLines','modalCancelBtn', 'modalStartBtn', 'restoreBanner', 'restoreBtn', 'discardBtn', 'bannerDownloadBtn', 'downloadButton'];
      ids.forEach(id => {
        const el = document.getElementById(id);
        if (el) els[id] = el;
      });

      if (els.otpRequestBtn) els.otpRequestBtn.onclick = requestOTP;
      if (els.verifyBtn) els.verifyBtn.onclick = verifyOTP;
      if (els.recordButton)    els.recordButton.onclick    = startRecording;
      if (els.stopButton)      els.stopButton.onclick      = stopRecording;
      if (els.modalCancelBtn)  els.modalCancelBtn.onclick  = closeRecordModal;
      if (els.modalStartBtn)   els.modalStartBtn.onclick   = startRecordingActual;
      if (els.saveButton)      els.saveButton.onclick      = uploadAudio;
      if (els.restoreBtn)      els.restoreBtn.onclick      = restoreRecording;
      if (els.discardBtn)      els.discardBtn.onclick      = discardRecording;
      if (els.bannerDownloadBtn) els.bannerDownloadBtn.onclick = downloadRecording;
      if (els.downloadButton)  els.downloadButton.onclick  = downloadRecording;
      if (els.categorySelect) els.categorySelect.onchange = onCategoryChange;
      if (els.categoryDetail) els.categoryDetail.oninput = updatePreview;
      if (els.modeSelect) els.modeSelect.onchange = onModeChange;
      if (els.addStudentBtn) els.addStudentBtn.onclick = addStudentRow;
      if (els.staffSelect) els.staffSelect.onchange = updatePreview;

      renderStudentRows();

      checkSession();

      window.addEventListener('beforeunload', e => {
        if (originalBlob) { e.preventDefault(); e.returnValue = ''; }
      });
    });

    function updateStatus(msg) {
      if (els.status) els.status.textContent = msg;
    }

    async function requestOTP() {
      const email = els.emailInput.value.trim();
      if (!email) return alert("メールアドレスを入力してください");
      updateStatus("SENDING...");
      const res = await callGas({ action: 'requestOTP', email });
      if (res.success) {
        els.otpSection.classList.remove('hidden');
        updateStatus("認証コードを送信しました");
      } else {
        updateStatus("ERROR: " + res.message);
      }
    }

    async function verifyOTP() {
      const email = els.emailInput.value.trim();
      const otp = els.otpInput.value.trim();
      updateStatus("VERIFYING...");
      const res = await callGas({ action: 'verifyOTP', email, otp });
      if (res.success) {
        localStorage.setItem('email', email);
        localStorage.setItem('token', res.sessionToken);
        checkSession();
      } else {
        updateStatus("認証コードが正しくありません");
      }
    }

    function checkSession() {
      const email = localStorage.getItem('email');
      const token = localStorage.getItem('token');
      if (email && token) {
        els.loginView.classList.add('hidden');
        els.mainView.classList.remove('hidden');
        loadStudents();
        loadStaff();
        checkPendingRecording();
      } else {
        els.loginView.classList.remove('hidden');
        els.mainView.classList.add('hidden');
        updateStatus("LOGIN REQUIRED");
      }
    }

    async function loadStudents() {
      updateStatus("LOADING STUDENTS...");
      try {
        const res = await callGas({
          action: 'getStudents',
          email: localStorage.getItem('email'),
          sessionToken: localStorage.getItem('token')
        });
        if (res.authError) {
          localStorage.clear();
          checkSession();
          return;
        }
        studentOptions = res;
        renderStudentRows();
        updateStatus("READY ✓");
        applyRestoredMeta();
      } catch (e) {
        updateStatus("CONNECTION ERROR");
      }
    }

    function onCategoryChange() {
      const isOther = els.categorySelect.value === 'その他';
      els.categoryDetailGroup.classList.toggle('hidden', !isOther);
      if (!isOther) els.categoryDetail.value = '';
      updatePreview();
    }

    async function loadStaff() {
      try {
        const res = await callGas({
          action: 'getStaff',
          email: localStorage.getItem('email'),
          sessionToken: localStorage.getItem('token')
        });
        if (res.authError) return;
        els.staffSelect.innerHTML = '<option value="">-- 選択してください --</option>';
        res.forEach(name => {
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          els.staffSelect.appendChild(opt);
        });
        updatePreview();
        applyRestoredMeta();
      } catch (e) {
        els.staffSelect.innerHTML = '<option value="">取得失敗</option>';
      }
    }

    function updatePreview() {
      const catBase = els.categorySelect.value;
      const detail  = (catBase === 'その他' && els.categoryDetail.value.trim()) ? els.categoryDetail.value.trim() : '';
      const cat     = detail ? `その他(${detail})` : catBase;
      const sid     = validateStudents() ? '' : getSelectedStudents().map(s => s.id).join('-');
      const staff   = els.staffSelect ? els.staffSelect.value : '';
      const now     = new Date();
      const dateStr = String(now.getFullYear()).slice(2) + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0');
      const fname   = (sid && staff) ? `${cat}_${sid}_${dateStr}_${staff}.mp3` : "";
      els.filenamePreview.innerHTML = fname ? `FILE: <b>${fname}</b>` : "区分・学生・スタッフを選択してください";
      return fname;
    }

    async function startRecording() {
      const studentError = validateStudents();
      if (studentError) return alert(studentError);
      if (!els.staffSelect || !els.staffSelect.value) return alert("担当スタッフを選択してください");
      // 未保存の録音があるときは、新しい録音で消える前に確認する
      const pending = originalBlob || await idbGet('blob').catch(() => null);
      if (pending && !confirm("まだ保存していない録音があります。新しく録音すると消えます。続けますか？\n（残す場合は「キャンセル」→「録音を端末にダウンロード」）")) {
        els.downloadButton.classList.remove('hidden');
        return;
      }
      els.modalStaffName.textContent = els.staffSelect.value;
      els.modalStudentLines.innerHTML = '';
      getSelectedStudents().forEach(s => {
        const p = document.createElement('p');
        p.append('「自分が ');
        const strong = document.createElement('strong');
        strong.textContent = s.name;
        p.append(strong, ' です。」');
        els.modalStudentLines.appendChild(p);
      });
      els.recordModal.classList.remove('hidden');
    }

    function closeRecordModal() {
      els.recordModal.classList.add('hidden');
    }

    async function startRecordingActual() {
      closeRecordModal();
      await idbClear().catch(() => {});
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream, { audioBitsPerSecond: 32000 }); // 話し声用。バックアップを小さく保つ
        audioChunks = [];
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
          originalBlob = new Blob(audioChunks, { type: 'audio/webm' });
          idbPut('blob', originalBlob).catch(() => {});
          idbPut('meta', {
            category:  els.categorySelect.value,
            detail:    els.categoryDetail ? els.categoryDetail.value : '',
            mode:       els.modeSelect.value,
            studentIds: getStudentRowValues(),
            staffName:  els.staffSelect ? els.staffSelect.value : ''
          }).catch(() => {});
          els.saveButton.disabled = false;
          els.recordButton.classList.remove('recording-state');
          els.recordButton.textContent = '録音開始';
        };
        mediaRecorder.start();
        els.recordButton.classList.add('recording-state');
        els.recordButton.textContent = 'REC...';
        els.recordButton.disabled = true;
        els.stopButton.disabled = false;
        updateStatus("RECORDING...");
      } catch (e) {
        alert("マイクの使用を許可してください");
      }
    }

    function stopRecording() {
      if (mediaRecorder) mediaRecorder.stop();
      if (stream) stream.getTracks().forEach(t => t.stop());
      els.stopButton.disabled = true;
      updateStatus("STOPPED");
    }

    // 話し声用の設定：60分でも約14MB（GASの受け取り上限 約50MB・Geminiの上限 20MB に収まる）
    const MP3_SAMPLE_RATE = 16000, MP3_KBPS = 32;
    const MAX_UPLOAD_MB = 45;

    async function uploadAudio() {
      const fname = updatePreview().replace('.mp3', '');
      if (!fname) return alert(validateStudents() || "区分・学生・スタッフを選択してください");
      els.saveButton.disabled = true;
      try {
        updateStatus("CONVERTING...");
        const mp3Blob = await encodeToMp3(originalBlob);
        const audioDataUrl = await blobToDataUrl(mp3Blob);
        const sizeMb = audioDataUrl.length / 1024 / 1024;
        if (sizeMb > MAX_UPLOAD_MB) {
          throw new Error(`録音が大きすぎて送信できません（${sizeMb.toFixed(1)}MB）。「録音を端末にダウンロード」で保存してください`);
        }
        updateStatus(`SAVING... (${(mp3Blob.size / 1024 / 1024).toFixed(1)}MB)`);
        const res = await callGas({
          audioDataUrl,
          baseFileName: fname,
          email: localStorage.getItem('email'),
          sessionToken: localStorage.getItem('token')
        });
        if (res.authError) {
          throw new Error("ログインが切れました（別の端末でログインした可能性）。ページを再読み込みして再ログインし、「復元する」から保存してください");
        }
        if (!res.success) throw new Error(res.message);
        originalBlob = null;
        await idbClear().catch(() => {});
        els.downloadButton.classList.add('hidden');
        updateStatus("COMPLETED ✓");
      } catch (e) {
        updateStatus("ERROR: " + (e.message || e) + " ／ 録音データは残っています");
        els.saveButton.disabled = false;
        els.downloadButton.classList.remove('hidden');
      }
    }

    // 保存できないときの最終手段：録音をそのまま端末に保存する
    async function downloadRecording() {
      const blob = originalBlob || await idbGet('blob').catch(() => null);
      if (!blob) return alert("録音データが見つかりません");
      const base = updatePreview().replace('.mp3', '') || `recording_${Date.now()}`;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = base + '.webm';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    }

    function blobToDataUrl(blob) {
      return new Promise((res, rej) => {
        const reader = new FileReader();
        reader.onloadend = () => reader.error ? rej(reader.error) : res(reader.result);
        reader.readAsDataURL(blob);
      });
    }

    async function callGas(data) {
      let res;
      try {
        res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(data) });
      } catch (e) {
        throw new Error("通信に失敗しました。ネットワークを確認してください");
      }
      const text = await res.text();
      try {
        return JSON.parse(text);
      } catch (e) {
        throw new Error("サーバー側で処理が失敗しました（時間切れ・容量超過の可能性）");
      }
    }

    async function encodeToMp3(blob) {
      // 16kHzのコンテキストでデコードすると、その場でリサンプリングされメモリも抑えられる
      const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: MP3_SAMPLE_RATE });
      let buf;
      try {
        buf = await ctx.decodeAudioData(await blob.arrayBuffer());
      } finally {
        if (ctx.close) ctx.close();
      }
      const sampleRate = buf.sampleRate;
      const mono = toMonoInt16(buf);
      buf = null;
      const encoder = new lamejs.Mp3Encoder(1, sampleRate, MP3_KBPS);
      const mp3Data = [];
      const size = 1152;
      for (let i = 0; i < mono.length; i += size) {
        const mp3 = encoder.encodeBuffer(mono.subarray(i, i + size));
        if (mp3.length > 0) mp3Data.push(mp3);
        // 長い録音で画面が固まらないよう、ときどき処理を譲る
        if (i % (size * 500) === 0) {
          updateStatus(`CONVERTING... ${Math.floor(i / mono.length * 100)}%`);
          await new Promise(r => setTimeout(r, 0));
        }
      }
      const flush = encoder.flush();
      if (flush.length > 0) mp3Data.push(flush);
      return new Blob(mp3Data, { type: 'audio/mpeg' });
    }

    function toMonoInt16(buf) {
      const n = buf.numberOfChannels;
      const chs = [];
      for (let c = 0; c < n; c++) chs.push(buf.getChannelData(c));
      const res = new Int16Array(buf.length);
      for (let i = 0; i < buf.length; i++) {
        let s = 0;
        for (let c = 0; c < n; c++) s += chs[c][i];
        res[i] = Math.max(-1, Math.min(1, s / n)) * 32767;
      }
      return res;
    }
  </script>
